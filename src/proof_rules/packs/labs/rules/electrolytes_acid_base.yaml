- id: LAB-CA-HOCH-ALB-HOCH-1
  kind: ddx
  target: ddx.pseudohypercalcemia
  requires: [lab.albumin_g_l, lab.calcium_mmol_l]
  when:
    all:
    - {field: lab.calcium_mmol_l, op: gt, value: {ref: upper}}
    - {field: lab.albumin_g_l, op: gt, value: {ref: upper}}
  sources:
  - {ref: SRC-1015, locator: Introduction; Related Testing; Clinical Significance}
  - {ref: SRC-1001, locator: Introduction}
  status: draft_unreviewed
  migrated_from: CA_HOCH_ALB_HOCH
  tests:
  - {facts: {lab.calcium_mmol_l: 2.56, lab.albumin_g_l: 51}, refs: {lab.calcium_mmol_l: {lower: 2.1, upper: 2.55}, lab.albumin_g_l: {
        lower: 35, upper: 50}}, expect: true}
  - {facts: {lab.calcium_mmol_l: 2.55, lab.albumin_g_l: 51}, refs: {lab.calcium_mmol_l: {lower: 2.1, upper: 2.55}, lab.albumin_g_l: {
        lower: 35, upper: 50}}, expect: false}
  - {facts: {lab.calcium_mmol_l: 2.56, lab.albumin_g_l: 50}, refs: {lab.calcium_mmol_l: {lower: 2.1, upper: 2.55}, lab.albumin_g_l: {
        lower: 35, upper: 50}}, expect: false}
  - {facts: {lab.calcium_mmol_l: 2.56}, refs: {lab.calcium_mmol_l: {lower: 2.1, upper: 2.55}, lab.albumin_g_l: {lower: 35,
        upper: 50}}, expect: unknown}
