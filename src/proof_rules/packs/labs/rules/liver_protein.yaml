- id: LAB-ALT-HOCH-BIL-HOCH-1
  kind: ddx
  target: ddx.acute_hepatitis
  requires: [lab.alt_u_l, lab.bilirubin_umol_l]
  when:
    all:
    - {field: lab.alt_u_l, op: gt, value: {ref: upper}}
    - {field: lab.bilirubin_umol_l, op: gt, value: {ref: upper}}
  sources:
  - {ref: SRC-1046, locator: Clinical Significance; Etiology and Epidemiology > Pathological Causes}
  - {ref: SRC-1037, locator: Etiology; Evaluation}
  status: draft_unreviewed
  migrated_from: ALT_HOCH_BIL_HOCH
  tests:
  - {facts: {lab.alt_u_l: 56, lab.bilirubin_umol_l: 22}, refs: {lab.alt_u_l: {lower: 5, upper: 55}, lab.bilirubin_umol_l: {
        lower: 0, upper: 21}}, expect: true}
  - {facts: {lab.alt_u_l: 55, lab.bilirubin_umol_l: 22}, refs: {lab.alt_u_l: {lower: 5, upper: 55}, lab.bilirubin_umol_l: {
        lower: 0, upper: 21}}, expect: false}
  - {facts: {lab.alt_u_l: 56, lab.bilirubin_umol_l: 21}, refs: {lab.alt_u_l: {lower: 5, upper: 55}, lab.bilirubin_umol_l: {
        lower: 0, upper: 21}}, expect: false}
  - {facts: {lab.alt_u_l: 56}, refs: {lab.alt_u_l: {lower: 5, upper: 55}, lab.bilirubin_umol_l: {lower: 0, upper: 21}}, expect: unknown}
