fields:
- code: lab.crp_mg_l
  section: lab
  type: number
  unit: mg/L
  decimals: 1
  bounds:
    lower: 0.1
    source: {ref: SRC-0101, locator: 'mimic-iv/concepts/measurement/inflammation.sql, lines 7 and 16 (value > 0 mg/L; no upper
        limit)'}
  alt_units:
  # MR6: 1 mg/dL = 10 mg/L by definition of the decilitre.
  - {unit: mg/dL, factor: 0.1, decimals: 2}
  labels:
    zh: {name: C反应蛋白, abbr: CRP}
    en: {name: C-reactive protein, abbr: CRP}
    de: {name: C-reaktives Protein, abbr: CRP}
  synthehr: {codes: [CRP], unit: mg/L}
- code: lab.alt_u_l
  section: lab
  type: number
  unit: U/L
  decimals: 0
  bounds:
    lower: 1
    source: {ref: SRC-0101, locator: 'mimic-iv/concepts/measurement/enzyme.sql, lines 8 and 42 (value > 0; no upper limit)'}
  labels:
    zh: {name: 丙氨酸氨基转移酶, abbr: ALT}
    en: {name: Alanine aminotransferase, abbr: ALT}
    de: {name: Alanin-Aminotransferase, abbr: ALT}
  synthehr: {codes: [ALT], unit: U/L}
- code: lab.urea_mmol_l
