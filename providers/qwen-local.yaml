# Qwen running locally in Ollama (D-06, A-77): the test model of this project, offline weights, no costs.
# Ollama's own chat API (D-12): only there can Qwen3's thinking be switched off; Ollama 0.11.11 ignores the switch on
# its OpenAI-compatible endpoint (B11). The model's digest is read from Ollama and stored in the run manifest (A-78).
name: qwen-local
api: ollama_chat
base_url: http://127.0.0.1:11434
model: qwen3:8b
api_key_env: null
origin: cn
# Declared location of the server: this computer, currently in China.
region: CN
ollama_digest: true
params:
  max_tokens: 1024
  seed: 0
  # Qwen3 answers without thinking first; the manifest records the switch (RK-08).
  think: false
pricing: {input_per_mtok: 0, output_per_mtok: 0, currency: EUR}
timeout_seconds: 300
