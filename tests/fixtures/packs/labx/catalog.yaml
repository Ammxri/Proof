fields:
  - code: lab.crp_mg_l
    section: lab
    type: number
    unit: mg/L
    decimals: 0
    bounds: {lower: 0, upper: 500, source: {ref: SRC-9002, locator: fixture}}
    labels:
      zh: {name: C反应蛋白, abbr: CRP}
      en: {name: C-reactive protein, abbr: CRP}
      de: {name: C-reaktives Protein, abbr: CRP}
    alt_units:
      - {unit: mg/dL, factor: 0.1, decimals: 1}
