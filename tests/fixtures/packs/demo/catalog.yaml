fields:
  - code: vital.temp_c
    section: vital
    type: number
    unit: °C
    decimals: 1
    bounds: {lower: 30.0, upper: 44.0, source: {ref: SRC-9001, locator: fixture}}
    labels:
      zh: {name: 体温}
      en: {name: Temperature, abbr: T}
      de: {name: Temperatur, abbr: T}
    alt_units:
      - {unit: °F, factor: 1.8, offset: 32, decimals: 1}
  - code: vital.resp_rate
    section: vital
    type: int
    unit: /min
    bounds: {lower: 4, upper: 60, source: {ref: SRC-9001, locator: fixture}}
    labels:
      zh: {name: 呼吸频率}
      en: {name: Respiratory rate, abbr: RR}
      de: {name: Atemfrequenz, abbr: AF}
  - code: vital.sbp
    section: vital
    type: int
    unit: mmHg
    bounds: {lower: 40, upper: 260, source: {ref: SRC-9001, locator: fixture}}
    labels:
      zh: {name: 收缩压}
      en: {name: Systolic blood pressure, abbr: SBP}
      de: {name: Systolischer Blutdruck, abbr: sRR}
  - code: vital.mental_status
    section: vital
    type: enum
    values: [normal, altered]
    value_labels:
      normal: {zh: 正常, en: normal, de: unauffällig}
      altered: {zh: 改变, en: altered, de: verändert}
    labels:
      zh: {name: 意识状态}
      en: {name: Mental status}
      de: {name: Bewusstseinszustand}
  - code: hx.cough
    section: hx
    type: bool
    labels:
      zh: {name: 咳嗽}
      en: {name: Cough}
      de: {name: Husten}
  - code: hx.onset_days
    section: hx
    type: int
    unit: d
    bounds: {lower: 0, upper: 60, source: {ref: SRC-9001, locator: fixture}}
    labels:
      zh: {name: 起病天数}
      en: {name: Days since onset}
      de: {name: Tage seit Beginn}
  - code: exam.rash
    section: exam
    type: bool
    labels:
      zh: {name: 皮疹}
      en: {name: Rash}
      de: {name: Ausschlag}

# Variant lists for MR4 and MR7 (KONZEPT 4.1), invented test data without clinical meaning.
irrelevant:
  - code: hx.fixture_detail
    when: {}
    labels:
      zh: {name: 测试细节, value: 无关}
      en: {name: Fixture detail, value: irrelevant}
      de: {name: Testdetail, value: unerheblich}
  - code: hx.fixture_detail_older
    when: {min_age: 60}
    labels:
      zh: {name: 测试细节二, value: 无关}
      en: {name: Second fixture detail, value: irrelevant}
      de: {name: Zweites Testdetail, value: unerheblich}
  - code: exam.fixture_detail_female
    when: {sex: [f]}
    labels:
      zh: {name: 测试检查, value: 无关}
      en: {name: Fixture finding, value: irrelevant}
      de: {name: Testbefund, value: unerheblich}
contradictions:
  - id: DEM-MR7-001
    field: vital.temp_c
    section: exam
    when: {field: vital.temp_c, op: ge, value: 38.0}
    sources: [{ref: SRC-9001, locator: fixture}]
    labels:
      zh: {name: 测试备注, value: 无发热}
      en: {name: Fixture note, value: no fever}
      de: {name: Testnotiz, value: kein Fieber}
  - id: DEM-MR7-002
    field: hx.cough
    section: vital
    when: {field: hx.cough, op: eq, value: false}
    labels:
      zh: {name: 测试备注, value: 咳嗽}
      en: {name: Fixture note, value: coughing}
      de: {name: Testnotiz, value: hustet}
